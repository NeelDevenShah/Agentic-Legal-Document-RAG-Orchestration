services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: virallens-app
    env_file:
      - .env
    environment:
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ""
      QDRANT_PATH: /tmp/qdrant
      QDRANT_COLLECTION_NAME: virallens_corpus
      GRADIO_SERVER_NAME: 0.0.0.0
      GRADIO_SERVER_PORT: 7860
    volumes:
      - .:/app
    depends_on:
      qdrant:
        condition: service_healthy
    ports:
      - "7860:7860"

  qdrant:
    image: qdrant/qdrant:v1.13.4
    container_name: virallens-qdrant
    volumes:
      - qdrant_storage:/qdrant/storage
    ports:
      - "6333:6333"
    healthcheck:
      # Official image has no curl/wget; probe /readyz over bash /dev/tcp.
      test:
        [
          "CMD-SHELL",
          'bash -c ''exec 3<>/dev/tcp/127.0.0.1/6333 && printf "GET /readyz HTTP/1.1\r\nHost: 127.0.0.1\r\nConnection: close\r\n\r\n" >&3 && head -1 <&3 | grep -q "200"'' || exit 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  qdrant_storage: