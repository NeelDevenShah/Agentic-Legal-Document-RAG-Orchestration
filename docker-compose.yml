services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: virallens-app
    env_file:
      - .env
    environment:
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ""
      QDRANT_PATH: /tmp/qdrant
      QDRANT_COLLECTION_NAME: virallens_corpus
      MYSQL_URL: mysql://virallens:virallens@mysql:3306/virallens
      GRADIO_SERVER_NAME: 0.0.0.0
      GRADIO_SERVER_PORT: 7860
    volumes:
      - .:/app
    depends_on:
      qdrant:
        condition: service_healthy
      mysql:
        condition: service_healthy
    ports:
      - "7860:7860"

  qdrant:
    image: qdrant/qdrant:v1.13.4
    container_name: virallens-qdrant
    volumes:
      - qdrant_storage:/qdrant/storage
    ports:
      - "6333:6333"
    healthcheck:
      # Official image has no curl/wget; probe /readyz over bash /dev/tcp.
      test:
        [
          "CMD-SHELL",
          'bash -c ''exec 3<>/dev/tcp/127.0.0.1/6333 && printf "GET /readyz HTTP/1.1\r\nHost: 127.0.0.1\r\nConnection: close\r\n\r\n" >&3 && head -1 <&3 | grep -q "200"'' || exit 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  mysql:
    image: mysql:8.4
    container_name: virallens-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: virallens
      MYSQL_USER: virallens
      MYSQL_PASSWORD: virallens
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 20

volumes:
  qdrant_storage:
  mysql_data: